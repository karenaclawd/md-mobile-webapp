    <title>Markdown Mobile Reader</title>
    <link rel="manifest" href="/md-mobile-webapp/manifest.json" />
    <link rel="apple-touch-icon" href="/md-mobile-webapp/pwa-icon.svg" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/md-mobile-webapp/service-worker.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>

      rel="stylesheet"
    />
